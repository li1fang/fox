name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-ui-probe:
    uses: ./.github/workflows/native-ui-diagnostic.yml

  public-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Bootstrap clean public checkout
        run: npm run bootstrap
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public Web and repository gates
        run: npm run verify:public -- --component web --output .tmp/verification/ci-web
      - name: Public dependency audit
        run: npm audit --audit-level=high
      - name: Public evidence only (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-web-${{ github.sha }}
          path: |
            .tmp/verification/ci-web/suite.json
            .tmp/verification/ci-web/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  public-native:
    needs: native-ui-probe
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      FOX_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Required native toolchain (never fall back to default Xcode)
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          curl --fail --location --output "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip
          printf '%s  %s\n' '0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878' "$RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/fox-tools"
          echo "$RUNNER_TEMP/fox-tools/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Bootstrap clean public checkout
        run: npm run bootstrap
      - name: Public native contracts, both apps and phone/pad UI
        run: npm run verify:public -- --component native --output .tmp/verification/ci-native
      - name: Public evidence only (no xcresult or private corpus)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-native-${{ github.sha }}
          path: |
            .tmp/verification/ci-native/suite.json
            .tmp/verification/ci-native/*.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
