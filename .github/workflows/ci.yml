name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        run: npm run verify

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

  native-core:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test offline training core
        env:
          FOX_R2_EVIDENCE_DIR: /tmp/fox-r2-schema-fixtures
          FOX_M3_EVIDENCE_DIR: /tmp/fox-m3-schema-fixtures
        run: swift test --package-path apps/ipad/FoxTrainingCore
      - name: Set up Node for journal test entrypoint
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python for schema validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema test dependency
        run: python -m pip install -r scripts/journal-schema-requirements.txt
      - name: Validate native vision report schemas
        run: python scripts/validate-vision-schema.py /tmp/fox-r2-schema-fixtures
      - name: Validate pulldown peak and return contracts
        run: python scripts/validate-pulldown-schema.py /tmp/fox-m3-schema-fixtures
      - name: Validate action strategy contracts
        run: python scripts/validate-motion-contracts.py
      - name: Test journal storage and portable schema
        run: npm run test:journal
      - name: Install XcodeGen for native application integration tests
        run: brew install xcodegen
      - name: Test journal application layer with real local storage
        env:
          FOX_IOS_UI_DERIVED_DATA: .tmp/ci-journal-app-tests
        run: npm run test:home
      - name: Test visual preparation and batch launch flows
        env:
          FOX_IOS_UI_DERIVED_DATA: .tmp/ci-journal-app-tests
        run: npm run test:vision:flow
